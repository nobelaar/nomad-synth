[package]
name = "nomad-app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "nomad"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
nomad-core = { path = "../nomad-core" }
nomad-runtime = { path = "../nomad-runtime" }

[dev-dependencies]
egui_kittest = "0.37"
serde_json = "1"
